[project]
name = "charmlint"
version = "0.2.1"
description = "A charm-aware, model-agnostic linter for Juju charms"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Tony Meyer", email = "tony.meyer@canonical.com" },
]
keywords = ["juju", "charm", "linter", "charmlint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.152.4",
    "coverage[toml]>=7.13.5",
    "pip-audit==2.10.1",
    "pre-commit-hooks==6.0.0",
    "ruff==0.15.14",
    "ty==0.0.38",
    "zizmor==1.11.0",
]

[project.scripts]
charmlint = "charmlint._cli:cli_entry"

[project.urls]
Homepage = "https://github.com/canonical/charmlint"
Repository = "https://github.com/canonical/charmlint"
Issues = "https://github.com/canonical/charmlint/issues"

[tool.uv]
# Don't resolve a release until it is a week old. This covers every uv
# resolution path (uv add, uv lock, CI), not just Dependabot's PRs.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmlint"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG002", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["charmlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["charmlint"]

[tool.coverage.report]
# _pypi_attest.py (0%) is untested until the ATT rules land — see
# RULES_TRACKER.md. Raise this floor when it gains tests or is removed.
fail_under = 75
