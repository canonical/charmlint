[project]
name = "charmlint"
version = "0.2.1"
description = "A linter for Juju charms"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Tony Meyer", email = "tony.meyer@canonical.com" },
]
keywords = ["juju", "charm", "linter", "charmlint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.168.1",
    "coverage[toml]>=7.16.1",
    "pip-audit==2.10.1",
    "pre-commit-hooks==6.0.0",
    "ruff==0.16.9",
    "ty==0.0.84",
    "zizmor==1.30.1",
]

[project.scripts]
charmlint = "charmlint._cli:cli_entry"

[project.urls]
Homepage = "https://github.com/canonical/charmlint"
Repository = "https://github.com/canonical/charmlint"
Issues = "https://github.com/canonical/charmlint/issues"

[tool.uv]
# Don't resolve a release until it is a week old. This covers every uv
# resolution path (uv add, uv lock, CI), not just Dependabot's PRs.
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmlint"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.format]
preview = true
# A Charm Tech baseline governance file, kept byte-identical to the baseline
# so it can be updated from there. It is still linted and type-checked.
exclude = [".github/check-conventional-pr-title.py"]

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "noqa-comments",  # RUF105: use `# ruff: ignore[...]`
]
ignore = [
    "line-too-long",  # E501 (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "unused-method-argument",  # ARG002
    "assert",  # S101
    "suspicious-subprocess-import",  # S404
]

[tool.ruff.lint.isort]
known-first-party = ["charmlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["charmlint"]

[tool.coverage.report]
# Total coverage is about 94% even with _pypi_attest.py at 0%: it is kept,
# untested, for the attestation rules to come back to (#299). Raise this
# floor again once it has tests.
fail_under = 90
