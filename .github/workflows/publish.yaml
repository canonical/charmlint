name: Publish

# Publishing a GitHub release is what puts the package on PyPI. A manual run
# builds a .devN version and publishes it to TestPyPI instead, to exercise the
# same key steps.
#
# `published` rather than `released`, so pre-releases publish too.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One publish at a time per release, and one manual run at a time. Two runs
# would build the same thing and race each other to the index.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to ${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }} (Trusted Publishing)
    runs-on: ubuntu-latest
    environment:
      # The name must match the environment registered with the trusted
      # publisher on PyPI (and separately on TestPyPI).
      name: ${{ github.event_name == 'release' && 'publish-pypi' || 'publish-testpypi' }}
      # Cosmetic: the link shown against the deployment in the GitHub UI.
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/charmlint' || 'https://test.pypi.org/p/charmlint' }}
    permissions:
      id-token: write  # OIDC to PyPI + sigstore for attestations.
      attestations: write  # Write build-provenance + SBOM predicates.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit the release's tag points at, named rather than left to
          # whatever the event's default checkout would be. Empty for a manual
          # run, which builds the ref it was dispatched from.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check the tag matches the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os, pathlib, sys, tomllib
          tag = os.environ["TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              print(f"::error::Tag {tag} does not match pyproject.toml version {version} (expected v{version}).")
              sys.exit(1)

      - name: Give the build a .dev suffix
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        shell: python
        run: |
          import os, pathlib, re, sys, tomllib
          run_number = os.environ["RUN_NUMBER"]
          path = pathlib.Path("pyproject.toml")
          # Write dev version.
          path.write_text(re.sub(
              r'^version = "([^"]+)"', rf'version = "\1.dev{run_number}"', path.read_text(),
              count=1, flags=re.MULTILINE,
          ))
          # Ensure we wrote the dev version correctly.
          version = tomllib.loads(path.read_text())["project"]["version"]
          if not version.endswith(f".dev{run_number}"):
              print(f"::error::Failed to add a .dev suffix; version is {version}.")
              sys.exit(1)
          print(f"Building {version}")

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      # cyclonedx-py runs from its own locked project (.github/sbom) so that
      # neither it nor the dev group is synced into the venv it describes.
      - name: Generate CycloneDX SBOM
        run: |
          uv sync --frozen --no-dev
          uv run --frozen --project .github/sbom cyclonedx-py environment .venv \
            --output-format JSON \
            --output-file sbom.cdx.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Attest SBOM (CycloneDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.cdx.json

      # Only the SBOM is uploaded: the sdist and wheel go to PyPI moments later
      # and stay there, whereas this is the only convenient copy of the SBOM
      # (the other being inside the attestation predicate).
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
