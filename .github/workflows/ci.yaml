name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions: {}

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: uv lock --check
        run: uv lock --check
      - name: ruff check
        run: uv run --group dev ruff check src tests
      - name: ruff format
        run: uv run --group dev ruff format --check src tests
      - name: ty
        run: uv run --group dev ty check src tests
      - name: Rule reference up to date
        run: uv run python tools/generate_rules_doc.py --check

  python-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: uv run --group dev pytest --cov=charmlint --cov-report=term-missing
