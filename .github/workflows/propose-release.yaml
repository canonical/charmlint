---
name: Propose a release

# The first of the two release workflows: work out the version, write the
# changelog, bump the version, draft the release notes, and open a pull
# request with all of it. A human reviews and merges that pull request;
# creating the release is the next workflow's job.
#
# Worth knowing:
#
# - The previous version is taken from the last `v*` tag on main.
# - The pull request is opened with the workflow's own token, so its checks
#   don't start. Close and reopen it to run them.
#   TODO: open it with a GitHub App token or a PAT so the checks start on
#   their own, and drop the close-and-reopen step here and in
#   CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release, as X.Y.Z (or X.Y.ZrcN). Leave this empty to
          work it out from the conventional commits since the last tag.
        required: false
        type: string
      dry_run:
        description: >-
          Do everything except push the branch and open the pull request. The
          proposed version, changelog and notes go in the run summary.
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # The team's release tools, pinned to a commit rather than a branch: a
  # release should be reproducible, and these decide what the changelog and
  # the drafted notes say.
  CHANGELOG: >-
    git+https://github.com/canonical/charm-tech-code@cc25c095ea7fee6277d02460771861fb5c5d398f#subdirectory=changelog
  DRAFT_RELEASE_NOTES: >-
    git+https://github.com/canonical/charm-tech-code@cc25c095ea7fee6277d02460771861fb5c5d398f#subdirectory=draft-release-notes

jobs:
  propose:
    name: Propose a release
    # Releases only come from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release-notes  # Required to access secrets.OPENROUTER_API_KEY.
    permissions:
      contents: write  # To push the release-prep branch.
      pull-requests: write  # To open the pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # The whole history and its tags: the release is counted from the tag.
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Work out the version and write the changelog entry
        id: propose
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release/propose-release-version.py

      - name: Add the entry to CHANGES.md
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/changes-entry.md" CHANGES.md > "$RUNNER_TEMP/CHANGES.md"
          mv "$RUNNER_TEMP/CHANGES.md" CHANGES.md

      - name: Update the version
        env:
          VERSION: ${{ steps.propose.outputs.version }}
        run: |
          set -euo pipefail
          # Updates pyproject.toml and the project's entry in uv.lock.
          uv version --no-sync "$VERSION"
          git --no-pager diff --stat

      # There are no exemplars yet: none of charmlint's earlier releases has
      # notes worth imitating. Once one does, add it to
      # .github/release/release-note-exemplars.md and pass that file with
      # --exemplars, headed with the release's title.
      - name: Draft the release notes
        env:
          VERSION: ${{ steps.propose.outputs.version }}
          PREVIOUS: ${{ steps.propose.outputs.previous }}
          # The model is a repository variable rather than something pinned
          # here, so that changing it is a settings edit and not a pull
          # request. Neither it nor the key existing is required: without
          # them the notes are a placeholder for the reviewer to fill in.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          # The commit messages are the pull request descriptions, which say
          # what a change means rather than only what it is.
          git log --reverse --no-merges --name-only --format='%x1e%s%x1f%b%x1f' \
            "$PREVIOUS..HEAD" > "$RUNNER_TEMP/commits.txt"
          uvx --from "$DRAFT_RELEASE_NOTES" draft-release-notes \
            --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --previous "$PREVIOUS" \
            --branch main \
            --changelog "$RUNNER_TEMP/changes-entry.md" \
            --compare-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...v$VERSION" \
            --commits "$RUNNER_TEMP/commits.txt" \
            --output "$RUNNER_TEMP/release-notes.md" \
            --title-output "$RUNNER_TEMP/release-title.md"

      - name: Write the pull request description and the run summary
        env:
          VERSION: ${{ steps.propose.outputs.version }}
          PREVIOUS: ${{ steps.propose.outputs.previous }}
          VERSION_INPUT: ${{ inputs.version }}
        shell: python
        run: |
          import os
          import pathlib
          import string

          version = os.environ['VERSION']
          previous = os.environ['PREVIOUS']
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          title = (temp / 'release-title.md').read_text()
          notes = (temp / 'release-notes.md').read_text()
          changes_entry = (temp / 'changes-entry.md').read_text()
          if os.environ['VERSION_INPUT']:
              version_note = (
                  f'{version} was given as an explicit version when the workflow was run.'
              )
          else:
              version_note = (
                  f'{version} was worked out from the conventional commits: a `feat` (or'
                  ' a `!`) makes it a minor bump, and anything else a patch bump. That'
                  ' does not always match'
                  f' [docs/versioning.md]({repo_url}/blob/main/docs/versioning.md) (a'
                  ' `fix` that makes a rule report more is a minor bump there), so check'
                  ' it. If it is wrong, close this, delete the branch, and run the'
                  ' workflow again with an explicit version.'
              )
          template = pathlib.Path('.github/release/release-pr-body.md').read_text()
          body = string.Template(template).substitute(
              version=version,
              previous=previous,
              previous_version=previous.removeprefix('v'),
              repo_url=repo_url,
              version_note=version_note,
              title=title,
              notes=notes,
          )
          (temp / 'pr-body.md').write_text(body)

          summary = f"""\
          ## {version}

          Counted from the last tag on main, `{previous}`.

          <details><summary>Changelog entry</summary>

          {changes_entry}
          </details>

          ### Draft release title

          {version}: {title}
          ### Draft release notes

          {notes}"""
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)

      - name: Commit, push, and open the pull request
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.propose.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_branch="release-prep-$VERSION"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$head_branch"
          # Every tracked file the steps above changed, and nothing else.
          git add -u
          git commit -m "chore: prepare release $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:refs/heads/$head_branch"

          url=$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "$head_branch" \
            --title "chore: update changelog and version for $VERSION release" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "Opened $url"
          printf '\n### Pull request\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
