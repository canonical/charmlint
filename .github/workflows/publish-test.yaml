name: Publish (TestPyPI)

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Build and publish to TestPyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    environment:
      name: publish-testpypi
      url: https://test.pypi.org/p/charmlint
    permissions:
      id-token: write  # OIDC to TestPyPI.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: false

      - name: Give the build a .dev suffix
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sed -i -E "0,/^version = \"([^\"]+)\"/s//version = \"\\1.dev${RUN_NUMBER}\"/" pyproject.toml
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          case "$version" in
            *.dev"$RUN_NUMBER") echo "Building $version" ;;
            *) echo "::error::Failed to add a .dev suffix; version is $version." ; exit 1 ;;
          esac

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
