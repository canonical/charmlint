[package]
name = "charmlint-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "charmlint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
